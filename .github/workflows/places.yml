name: Населені пункти

# Довідник міст, селищ і сіл України (OpenStreetMap) для миттєвих підказок без інтернету.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 3 */3 *'          # раз на квартал
  push:
    branches: [main]
    paths: ['.github/workflows/places.yml', 'tools/build_places.py']

permissions:
  contents: write
  actions: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  places:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Зібрати довідник з OpenStreetMap
        run: |
          mkdir -p web/data
          python3 tools/build_places.py web/data/places.json
          ls -la web/data/places.json

      - name: Зберегти в репозиторій і перезібрати застосунок
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add web/data/places.json
          if git diff --cached --quiet; then echo "без змін"; exit 0; fi
          python3 -c "import json;p='web/version.json';v=json.load(open(p));v['web']+=1;json.dump(v,open(p,'w'))"
          git add web/version.json
          git commit -m "Населені пункти: оновлення довідника з OpenStreetMap"
          git push origin HEAD:main
          gh workflow run build.yml --ref main
