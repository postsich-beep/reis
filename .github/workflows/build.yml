name: Збірка і реліз

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK і реліз
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Номер версії
        id: v
        run: |
          WEB=$(python3 -c "import json;print(json.load(open('web/version.json'))['web'])")
          NAME=$(python3 -c "import json;print(json.load(open('web/version.json'))['name'])")
          NATIVE=$(python3 -c "import json;print(json.load(open('web/version.json')).get('native',0))")
          echo "web=$WEB" >> "$GITHUB_OUTPUT"
          echo "native=$NATIVE" >> "$GITHUB_OUTPUT"
          echo "vname=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Шрифти й значки для офлайн-карти (Protomaps)
        run: |
          git clone --depth 1 https://github.com/protomaps/basemaps-assets /tmp/bma
          for f in "Noto Sans Regular" "Noto Sans Medium" "Noto Sans Italic"; do
            mkdir -p "web/vendor/glyphs/$f"
            for r in 0-255 256-511 1024-1279 8192-8447; do cp "/tmp/bma/fonts/$f/$r.pbf" "web/vendor/glyphs/$f/" || echo "немає $f/$r"; done
          done
          mkdir -p web/vendor/sprites
          cp /tmp/bma/sprites/v4/light.json /tmp/bma/sprites/v4/light.png /tmp/bma/sprites/v4/light@2x.json /tmp/bma/sprites/v4/light@2x.png web/vendor/sprites/ || echo "значків немає"
          du -sh web/vendor/glyphs web/vendor/sprites || true

      - name: Рушій якісного голосу (sherpa-onnx v1.13.6, лише arm64-v8a і armeabi-v7a)
        run: |
          set -e
          V=v1.13.6
          F=sherpa-onnx-$V-android.tar.bz2
          curl -fsSL --retry 3 -o /tmp/$F "https://github.com/k2-fsa/sherpa-onnx/releases/download/$V/$F" \
            || curl -fsSL --retry 3 -o /tmp/$F "https://huggingface.co/csukuangfj2/sherpa-onnx-libs/resolve/main/$F"
          mkdir -p /tmp/so && tar xjf /tmp/$F -C /tmp/so
          for abi in arm64-v8a armeabi-v7a; do
            mkdir -p android/app/src/main/jniLibs/$abi
            cp -v /tmp/so/jniLibs/$abi/libsherpa-onnx-jni.so android/app/src/main/jniLibs/$abi/
            if [ -f /tmp/so/jniLibs/$abi/libonnxruntime.so ]; then cp -v /tmp/so/jniLibs/$abi/libonnxruntime.so android/app/src/main/jniLibs/$abi/; fi
          done
          du -sh android/app/src/main/jniLibs/*

      - name: Інтерфейс усередину APK
        run: |
          mkdir -p android/app/src/main/assets
          rm -rf android/app/src/main/assets/web
          cp -r web android/app/src/main/assets/web

      - name: Збірка APK
        working-directory: android
        run: >
          gradle --no-daemon :app:assembleRelease
          -PvCode=${{ steps.v.outputs.code }}
          -PvName=${{ steps.v.outputs.name }}
          -PupdateRepo=${{ github.repository }}
          -PnativeRev=${{ steps.v.outputs.native }}

      - name: Файли релізу
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/reis.apk
          (cd web && zip -qr ../out/web.zip .)
          echo "{\"apkCode\": ${{ steps.v.outputs.code }}, \"apkName\": \"${{ steps.v.outputs.name }}\", \"web\": ${{ steps.v.outputs.web }}, \"native\": ${{ steps.v.outputs.native }}, \"name\": \"${{ steps.v.outputs.vname }}\"}" > out/version.json
          cat out/version.json
          ls -la out

      - name: Реліз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.name }}
          name: Рейс ${{ steps.v.outputs.name }}
          body: |
            Установка: завантажте **reis.apk** на телефон і відкрийте файл.
            Оновлення ставиться поверх попередньої версії, налаштування зберігаються.
          make_latest: 'true'
          files: |
            out/reis.apk
            out/web.zip
            out/version.json

      - uses: actions/upload-artifact@v4
        with:
          name: reis-apk
          path: out/reis.apk

  tests:
    name: Перевірка інтерфейсу
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright-core@1.65.1
      - run: npx playwright-core install --with-deps chromium
      - run: node tests/e2e.mjs
