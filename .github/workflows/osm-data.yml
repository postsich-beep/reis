name: Дані OpenStreetMap

# Раз на місяць збирає з вивантаження OpenStreetMap для України (Geofabrik) базу піт-стопів
# (АЗС, стоянки й зони відпочинку для фур, мотелі, камери, кафе біля трас), довідник
# міст, селищ і сіл для миттєвих підказок і проблемні для фур ділянки (мости, висота, ґрунт, заборони). Без Overpass: його публічні сервери часто перевантажені.
on:
  workflow_dispatch:
  schedule:
    - cron: '41 2 2 * *'
  push:
    branches: [main]
    paths: ['.github/workflows/osm-data.yml', 'tools/build_osm.py', 'tools/build_stops.py', 'tools/build_places.py']

permissions:
  contents: write
  actions: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  osm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Інструменти
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          pip install --quiet osmium shapely

      - name: Вивантаження України з Geofabrik
        run: |
          # Адресу файлу беремо з офіційного каталогу Geofabrik (index-v1.json) — він переживає перенесення файлів;
          # далі відомі шляхи й дзеркало openstreetmap.fr. На кожну невдачу друкуємо код відповіді.
          cands=$(curl -fsSL --retry 3 https://download.geofabrik.de/index-v1.json | python3 -c "import json,sys; d=json.load(sys.stdin); print(' '.join(f['properties']['urls']['pbf'] for f in d['features'] if f['properties'].get('id')=='ukraine'))" || true)
          echo "каталог Geofabrik: ${cands:-немає}"
          # «latest» у Geofabrik перенаправляє на файл із датою; якщо того ще/вже немає — пробуємо файли попередніх днів
          for d in 0 1 2 3 4 5 6 7; do day=$(date -u -d "-$d day" +%y%m%d); cands="$cands https://download.geofabrik.de/europe/ukraine/ukraine-$day.osm.pbf https://download.geofabrik.de/europe/ukraine-$day.osm.pbf"; done
          cands="$cands https://download.geofabrik.de/europe/ukraine/ukraine-latest.osm.pbf https://download.geofabrik.de/europe/ukraine-latest.osm.pbf https://download.openstreetmap.fr/extracts/europe/ukraine-latest.osm.pbf https://download.openstreetmap.fr/extracts/europe/ukraine.osm.pbf"
          ok=""
          for round in 1 2 3; do
            for u in $cands; do
              code=$(curl -sIL -o /dev/null -w '%{http_code} %{url_effective}' "$u" || true)
              echo "перевірка: $u → $code"
              case "$code" in 200*) ;; *) continue;; esac
              if curl -fSL --retry 3 --retry-delay 20 -o ukraine.osm.pbf "$u" && [ "$(stat -c %s ukraine.osm.pbf)" -gt 300000000 ]; then echo "звідки: $u"; ok=1; break 2; fi
              echo "не вдалося: $u"
            done
            sleep 300
          done
          [ -n "$ok" ] || { echo "вивантаження України недоступне"; exit 1; }
          ls -la ukraine.osm.pbf
          osmium tags-filter ukraine.osm.pbf \
            nwr/amenity=fuel,restaurant,cafe,fast_food,parking \
            nwr/highway=services,rest_area,speed_camera w/highway=motorway,trunk,primary \
            nwr/tourism=motel n/place=city,town,village r/admin_level=4 \
            nwr/amenity=shower nwr/shower nwr/amenity:shower nwr/shower:hgv \
            nwr/amenity=toilets,drinking_water,water_point,car_wash,atm,bank,compressed_air,bbq nwr/leisure=picnic_table \
            nwr/tourism=picnic_site,hotel,guest_house,hostel nwr/shop=convenience,supermarket,kiosk,general,tyres,car_repair,truck_repair \
            w/maxweight w/maxweight:hgv w/maxheight w/maxheight:physical w/maxaxleload w/hgv w/smoothness \
            w/highway=secondary,tertiary,unclassified \
            -o filtered.osm.pbf --overwrite
          ls -la filtered.osm.pbf

      - name: Зібрати піт-стопи й довідник населених пунктів
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          python3 tools/build_osm.py filtered.osm.pbf "$RUNNER_TEMP/out/stops.json" "$RUNNER_TEMP/out/places.json" "$RUNNER_TEMP/out/hazards.json"
          ls -la "$RUNNER_TEMP/out"

      - name: Зберегти в репозиторій і перезібрати застосунок
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f ukraine.osm.pbf filtered.osm.pbf
          git pull --rebase origin main
          mkdir -p web/data
          for f in stops places hazards; do if [ -f "$RUNNER_TEMP/out/$f.json" ]; then cp "$RUNNER_TEMP/out/$f.json" web/data/ && git add "web/data/$f.json"; fi; done
          if git diff --cached --quiet; then echo "без змін"; exit 0; fi
          python3 -c "import json;p='web/version.json';v=json.load(open(p));v['web']+=1;json.dump(v,open(p,'w'))"
          git add web/version.json
          git commit -m "Дані OpenStreetMap: піт-стопи й населені пункти"
          git push origin HEAD:main
          gh workflow run build.yml --ref main
