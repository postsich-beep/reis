name: Пакети голосів

# Якісні офлайн-голоси для застосунку: моделі Piper (VITS) у форматі sherpa-onnx, перепаковані в zip
# (у телефоні zip розпаковується без сторонніх бібліотек). Кладуться в реліз voices; застосунок качає їх
# із Налаштування → Голос.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/voices.yml']

permissions:
  contents: write

jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 'Український голос (ukrainian_tts, 3 диктори — Лада, Микита, Тетяна)'
        run: |
          set -e
          N=vits-piper-uk_UA-ukrainian_tts-medium
          curl -fsSL --retry 3 -o /tmp/$N.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/$N.tar.bz2"
          tar xjf /tmp/$N.tar.bz2 -C /tmp
          D=/tmp/$N
          ls -la $D
          MODEL=$(cd $D && ls *.onnx | head -1)
          test -f "$D/tokens.txt" && test -d "$D/espeak-ng-data"
          cat > $D/voice.json <<EOF
          {"ver": 1, "name": "Piper uk_UA ukrainian_tts medium", "model": "$MODEL", "tokens": "tokens.txt", "data": "espeak-ng-data",
           "sr": 22050, "speakers": {"lada": 0, "mykyta": 1, "tetiana": 2},
           "source": "https://huggingface.co/rhasspy/piper-voices/tree/main/uk/uk_UA/ukrainian_tts/medium"}
          EOF
          cat $D/voice.json
          mkdir -p out
          (cd $D && zip -qr -9 "$GITHUB_WORKSPACE/out/voice-uk.zip" .)
          ls -la out
          SIZE=$(stat -c %s out/voice-uk.zip); UNZ=$(du -sb $D | cut -f1)
          echo "{\"uk\": {\"ver\": 1, \"zip\": $SIZE, \"size\": $UNZ}}" > out/voices.json
          cat out/voices.json

      - name: Реліз voices
        uses: softprops/action-gh-release@v2
        with:
          tag_name: voices
          name: Голоси для «Рейсу»
          make_latest: 'false'
          body: |
            Офлайн-голоси для застосунку «Рейс». Завантажуються із застосунку: Налаштування → Голос.
            voice-uk.zip — український голос Piper «ukrainian_tts» (medium): Тетяна, Лада (жіночі), Микита (чоловічий).
          files: |
            out/voice-uk.zip
            out/voices.json
