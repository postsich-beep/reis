<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#13171c">
<meta name="mobile-web-app-capable" content="yes">
<title>Рейс</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="app.css">
</head>
<body data-theme="day">
<div id="map"></div>
<div id="attr">© OpenStreetMap · OpenMapTiles · OpenFreeMap</div>

<header id="top">
  <div id="man" class="man" hidden>
    <div class="man-ico" id="manIco"></div>
    <div class="man-main"><div class="man-dist" id="manDist"></div><div class="man-text" id="manText"></div></div>
    <div class="man-then" id="manThen" hidden><span id="manThenLbl"></span><i id="manThenIco"></i></div>
    <button class="man-snap" id="manSnap" hidden></button>
  </div>
  <button id="strip" class="strip alone" data-level="none">
    <span class="strip-dot"></span><span class="strip-text" id="stripText"></span><span class="strip-counts" id="stripCounts"></span>
  </button>
</header>
<div id="toasts"></div>

<!-- одна кнопка швидких налаштувань замість стовпчика з 9 кнопок: на вузьких і коротких екранах нічого не накладається -->
<nav id="rail">
  <button class="rb" id="bQuick" aria-haspopup="dialog" aria-expanded="false"></button>
  <!-- (1.1.24) калібрування телефона: блідий — не калібрували (або давно), зелений — відкалібровано; дотик — три кроки на весь екран -->
  <button class="rb" id="bCal"></button>
  <!-- тип карти: один дотик — схема ↔ супутник (супутник лише з інтернетом) -->
  <button class="rb" id="bMap" aria-pressed="false"></button>
</nav>
<div id="quick" role="dialog" hidden></div>
<!-- справа внизу: «Моє місце» — зʼявляється лише тоді, коли карту зсунули й вона не стежить за машиною -->
<div id="zoom">
  <button class="rb" id="bCenter" hidden></button>
</div>

<!-- круг швидкості: праворуч угорі — знак обмеження, праворуч унизу (1.1.22) — кружечок GPS: зелений — сигнал є, червоний — немає; дотик — подробиці -->
<div id="speed"><b id="spdVal">0</b><span id="spdUnit"></span><i id="spdLim" hidden></i><button id="spdGps" type="button"></button></div>
<div id="spdPop" hidden></div>
<div id="wherePop" hidden></div>
<div id="photoView" hidden></div>
<!-- вибір варіанта маршруту: карта з обома варіантами зверху, дві карточки й кнопки внизу -->
<section id="routePick" hidden></section>
<section id="repSheet" role="dialog" hidden></section>
<!-- калібрування телефона: на весь екран -->
<section id="calib" role="dialog" aria-modal="true" hidden></section>
<!-- 1.1.9: приціл для позначки — дотик до карти ставить позначку туди, де водій бачив -->
<div id="aim" hidden></div>
<!-- 1.1.12: точки рейсу просто на карті — старт, через, фініш; пряма між ними й відстань -->
<div id="pts" hidden></div>
<div id="cam" hidden><div class="sign" id="camMax"></div><div><span id="camDist"></span><small id="camLbl"></small></div></div>
<div id="pick" hidden></div>

<footer id="bottom">
  <!-- плашка оновлення: «Нова версія — оновити»; ✕ ховає на 3 години -->
  <div id="updBar" hidden><button id="updGo"></button><button id="updX"></button></div>
  <button id="bAcceptGps" hidden></button>
  <!-- кнопки «без GPS» (Поворот, ±100 м) — над кнопками, між двома виступами нижньої плашки; видно лише коли потрібні -->
  <div id="tripbar">
    <button class="chip none" id="gpsChip"><i></i><span id="gpsText">GPS</span></button>
    <div class="nudge" id="nudge" hidden><button id="bTurn" class="turn-btn" hidden></button><button id="bFwd100"></button><button id="bBack100"></button></div>
  </div>
  <!-- (1.1.24) Нижня плашка — за контуром, який намалював Олексій: посередині низька (лише кнопки), по краях два виступи вгору.
       Лівий виступ — час прибуття, під ним скільки лишилось (км, хв). Правий — стрілка нахилу карти на всю висоту.
       Кнопки: Події · РЕЙС · Місця · Мітки; «Рейс» стоїть рівно посередині екрана (лівий виступ = одна кнопка + правий виступ).
       «Телефон» (калібрування) переїхав у стовпчик праворуч угорі — між налаштуваннями й видом карти. Контур малює ui.js (barShape). -->
  <div id="tabbar">
    <svg id="tbShape" aria-hidden="true"><path class="tb-fill"/><path class="tb-edge"/></svg>
    <div class="tb-main"><b id="eta"></b><span id="remain"></span></div>
    <div id="tabs">
      <button data-panel="feed"></button>
      <button data-panel="trip" class="main"></button>
      <button data-panel="places"></button>
      <!-- позначити подію на дорозі: ДТП, поліція, транспортна служба (бачать усі водії 2 години) -->
      <button id="tabRep"></button>
    </div>
    <!-- нахил карти: стрілка вгору-вниз без тла. Тягнемо вгору — дивимось збоку (3D), униз — згори (2D); те саме, що двома пальцями по карті -->
  <div id="tilt" role="slider" tabindex="0" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="60" aria-valuenow="0"><span class="tl-track"><b class="tl-thumb"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="tl-ax" d="M12 5v14"/><path class="tl-up" d="M7 9.200 12 4.200l5 5"/><path class="tl-dn" d="M7 14.800l5 5 5-5"/></svg></b></span></div>
  </div>
</footer>

<section id="panel" hidden>
  <header><button id="panelBack" hidden></button><h2 id="panelTitle"></h2><button id="panelClose"></button></header>
  <div id="panelBody"></div>
</section>

<!-- Лабораторія (1.1.12): окремий екран; вхід — у «Налаштуваннях» на логотипі: два дотики й тримати 3 с -->
<div id="labApp" hidden></div>

<div id="boot"><b>РЕЙС</b><span>навігатор для фур</span></div>

<script src="vendor/maplibre-gl.js"></script>
<script src="vendor/pmtiles.js"></script>
<script src="vendor/basemaps.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
